app:
  description: 该机器人通过 Dify Chatflow 接收用户导购问题，先进行意图分类，再根据问题类型调用 RAG 检索知识库；有依据时由 DeepSeek
    API 生成回答，无依据时进行兜底说明，商品带看分支则返回展区与展台位置信息，从而实现面向商场和产品展厅的智能导购问答流程。
  icon: 🤖
  icon_background: '#FFEAD5'
  icon_type: emoji
  mode: advanced-chat
  name: 智能导购MVP
  use_icon_as_answer_icon: false
